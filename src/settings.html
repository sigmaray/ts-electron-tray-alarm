<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">
  <main class="container py-4">
    <h1 class="h3 mb-4">Settings</h1>
    <section class="card shadow-sm mb-3">
      <div class="card-header fw-semibold">Time zone</div>
      <div class="card-body">
        <label class="form-label" for="settingsTimezone">Application time zone</label>
        <select id="settingsTimezone" class="form-select"></select>
        <p id="settingsTimezoneCurrent" class="form-text mb-0 mt-2"></p>
      </div>
    </section>

    <section class="card shadow-sm mb-3">
      <div class="card-header fw-semibold">Application</div>
      <div class="card-body">
        <div class="form-check">
          <input id="confirmQuit" class="form-check-input" type="checkbox" checked>
          <label class="form-check-label" for="confirmQuit">Ask for confirmation before quitting</label>
        </div>
      </div>
    </section>

    <section class="card shadow-sm mb-3">
      <div class="card-header fw-semibold">Countdown window</div>
      <div class="card-body">
        <label class="form-label" for="countdownFormat">Remaining time format</label>
        <select id="countdownFormat" class="form-select">
          <option value="compact">Minutes: 2m, 1m, &lt; 1m</option>
          <option value="clock">Time with seconds: 00:01:51</option>
          <option value="seconds">Total seconds: 111s</option>
        </select>
        <label class="form-label mt-3" for="countdownFontSize">Font size</label>
        <select id="countdownFontSize" class="form-select">
          <option value="8">8 pt</option><option value="9">9 pt</option>
          <option value="10">10 pt</option><option value="11">11 pt</option>
          <option value="12">12 pt</option><option value="13">13 pt</option>
          <option value="14">14 pt</option><option value="15">15 pt</option>
          <option value="16">16 pt</option><option value="17">17 pt</option>
          <option value="18">18 pt</option><option value="19">19 pt</option>
          <option value="20">20 pt</option><option value="21">21 pt</option>
          <option value="22">22 pt</option><option value="23">23 pt</option>
          <option value="24">24 pt</option><option value="25">25 pt</option>
          <option value="26">26 pt</option><option value="27">27 pt</option>
          <option value="28">28 pt</option><option value="29">29 pt</option>
          <option value="30">30 pt</option><option value="31">31 pt</option>
          <option value="32">32 pt</option>
        </select>
        <div class="form-check mt-3">
          <input id="countdownMenuButtonVisible" class="form-check-input" type="checkbox" checked>
          <label class="form-check-label" for="countdownMenuButtonVisible">Show menu button in the countdown window</label>
        </div>
      </div>
    </section>

    <section class="card shadow-sm mb-3">
      <div class="card-header fw-semibold">Colors</div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label" for="trayIconColor">Tray icon background</label>
          <div class="input-group">
            <input id="trayIconColor" class="form-control form-control-color flex-shrink-0" style="width: 3.5rem" type="color" value="#5b7fa6" title="Choose tray icon color">
            <span class="input-group-text">HEX</span>
            <input id="trayIconColorHex" class="form-control font-monospace" type="text" value="#5b7fa6" maxlength="7" pattern="#[0-9a-fA-F]{6}" placeholder="#5b7fa6" aria-label="Tray icon background HEX color" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="countdownBackgroundColor">Countdown window background</label>
          <div class="input-group">
            <input id="countdownBackgroundColor" class="form-control form-control-color flex-shrink-0" style="width: 3.5rem" type="color" value="#5b7fa6" title="Choose countdown window background color">
            <span class="input-group-text">HEX</span>
            <input id="countdownBackgroundColorHex" class="form-control font-monospace" type="text" value="#5b7fa6" maxlength="7" pattern="#[0-9a-fA-F]{6}" placeholder="#5b7fa6" aria-label="Countdown window background HEX color" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div>
          <label class="form-label" for="mainWindowBackgroundColor">Main window background</label>
          <div class="input-group">
            <input id="mainWindowBackgroundColor" class="form-control form-control-color flex-shrink-0" style="width: 3.5rem" type="color" value="#f8f9fa" title="Choose main window background color">
            <span class="input-group-text">HEX</span>
            <input id="mainWindowBackgroundColorHex" class="form-control font-monospace" type="text" value="#f8f9fa" maxlength="7" pattern="#[0-9a-fA-F]{6}" placeholder="#f8f9fa" aria-label="Main window background HEX color" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label" for="sectionHeaderBackgroundColor">Section header background</label>
          <div class="input-group">
            <input id="sectionHeaderBackgroundColor" class="form-control form-control-color flex-shrink-0" style="width: 3.5rem" type="color" value="#0d6efd" title="Choose section header background color">
            <span class="input-group-text">HEX</span>
            <input id="sectionHeaderBackgroundColorHex" class="form-control font-monospace" type="text" value="#0d6efd" maxlength="7" pattern="#[0-9a-fA-F]{6}" placeholder="#0d6efd" aria-label="Section header background HEX color" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label" for="sectionBackgroundColor">Section background</label>
          <div class="input-group">
            <input id="sectionBackgroundColor" class="form-control form-control-color flex-shrink-0" style="width: 3.5rem" type="color" value="#ffffff" title="Choose section background color">
            <span class="input-group-text">HEX</span>
            <input id="sectionBackgroundColorHex" class="form-control font-monospace" type="text" value="#ffffff" maxlength="7" pattern="#[0-9a-fA-F]{6}" placeholder="#ffffff" aria-label="Section background HEX color" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <button id="resetColors" class="btn btn-link px-0 pb-0">Reset colors to defaults</button>
      </div>
    </section>

    <p id="settingsStatus" class="small text-body-secondary" role="status" aria-live="polite"></p>
    <div class="d-flex justify-content-end gap-2">
      <button id="settingsCancel" class="btn btn-secondary">Close</button>
      <button id="settingsApply" class="btn btn-outline-primary">Apply</button>
      <button id="settingsSave" class="btn btn-primary">Save</button>
    </div>
  </main>
  <script>
    const api = window.electronAPI;
    const timezoneSelect = document.getElementById('settingsTimezone');
    const timezoneCurrent = document.getElementById('settingsTimezoneCurrent');
    const confirmQuit = document.getElementById('confirmQuit');
    const countdownFormat = document.getElementById('countdownFormat');
    const countdownFontSize = document.getElementById('countdownFontSize');
    const countdownMenuButtonVisible = document.getElementById('countdownMenuButtonVisible');
    const trayIconColor = document.getElementById('trayIconColor');
    const countdownBackgroundColor = document.getElementById('countdownBackgroundColor');
    const mainWindowBackgroundColor = document.getElementById('mainWindowBackgroundColor');
    const sectionHeaderBackgroundColor = document.getElementById('sectionHeaderBackgroundColor');
    const sectionBackgroundColor = document.getElementById('sectionBackgroundColor');
    const colorPairs = [
      { picker: trayIconColor, hex: document.getElementById('trayIconColorHex') },
      { picker: countdownBackgroundColor, hex: document.getElementById('countdownBackgroundColorHex') },
      { picker: mainWindowBackgroundColor, hex: document.getElementById('mainWindowBackgroundColorHex') },
      { picker: sectionHeaderBackgroundColor, hex: document.getElementById('sectionHeaderBackgroundColorHex') },
      { picker: sectionBackgroundColor, hex: document.getElementById('sectionBackgroundColorHex') },
    ];
    const status = document.getElementById('settingsStatus');

    function isHexColor(value) {
      return /^#[0-9a-fA-F]{6}$/.test(value.trim());
    }

    colorPairs.forEach(pair => {
      pair.picker.addEventListener('input', () => {
        pair.hex.value = pair.picker.value;
        pair.hex.setCustomValidity('');
      });
      pair.hex.addEventListener('input', () => {
        const value = pair.hex.value.trim();
        if (isHexColor(value)) {
          pair.picker.value = value.toLowerCase();
          pair.hex.setCustomValidity('');
        } else {
          pair.hex.setCustomValidity('Enter a color in #RRGGBB format.');
        }
      });
      pair.hex.addEventListener('blur', () => {
        if (isHexColor(pair.hex.value)) pair.hex.value = pair.picker.value;
      });
    });

    async function initializeSettings() {
      try {
        const [timezones, timezone, preferences] = await Promise.all([
          api.getTimezones(), api.getCurrentTimezone(), api.getAppPreferences(),
        ]);
        timezoneSelect.add(new Option('System time zone (default)', ''));
        [...timezones].sort().forEach(zone => timezoneSelect.add(new Option(zone, zone)));
        timezoneSelect.value = timezone.isSystem ? '' : timezone.effective;
        timezoneCurrent.textContent = `Currently using: ${timezone.effective}`;
        confirmQuit.checked = preferences.confirmQuit;
        countdownFormat.value = preferences.countdownFormat;
        countdownFontSize.value = String(preferences.countdownFontSize || 15);
        countdownMenuButtonVisible.checked = preferences.countdownMenuButtonVisible !== false;
        trayIconColor.value = preferences.trayIconColor || '#5b7fa6';
        countdownBackgroundColor.value = preferences.countdownBackgroundColor || '#5b7fa6';
        mainWindowBackgroundColor.value = preferences.mainWindowBackgroundColor || '#f8f9fa';
        sectionHeaderBackgroundColor.value = preferences.sectionHeaderBackgroundColor || '#0d6efd';
        sectionBackgroundColor.value = preferences.sectionBackgroundColor || '#ffffff';
        colorPairs.forEach(pair => { pair.hex.value = pair.picker.value; });
      } catch (error) {
        status.textContent = `Could not load settings: ${error.message || error}`;
      }
    }

    async function saveSettings(closeAfterSave) {
      const invalidColor = colorPairs.find(pair => !isHexColor(pair.hex.value));
      if (invalidColor) {
        invalidColor.hex.setCustomValidity('Enter a color in #RRGGBB format.');
        invalidColor.hex.reportValidity();
        invalidColor.hex.focus();
        return;
      }
      const buttons = [document.getElementById('settingsApply'), document.getElementById('settingsSave')];
      buttons.forEach(button => button.disabled = true);
      status.textContent = 'Saving…';
      try {
        await api.setTimezone(timezoneSelect.value || null);
        const result = await api.saveAppPreferences({
          confirmQuit: confirmQuit.checked,
          countdownFormat: countdownFormat.value,
          countdownMenuButtonVisible: countdownMenuButtonVisible.checked,
          countdownFontSize: Number(countdownFontSize.value),
          trayIconColor: colorPairs[0].hex.value.trim().toLowerCase(),
          countdownBackgroundColor: colorPairs[1].hex.value.trim().toLowerCase(),
          mainWindowBackgroundColor: colorPairs[2].hex.value.trim().toLowerCase(),
          sectionHeaderBackgroundColor: colorPairs[3].hex.value.trim().toLowerCase(),
          sectionBackgroundColor: colorPairs[4].hex.value.trim().toLowerCase(),
        });
        if (!result.ok) throw new Error(result.error || 'Could not save settings.');
        status.textContent = closeAfterSave ? 'Settings saved.' : 'Settings applied.';
        if (closeAfterSave) window.close();
      } catch (error) {
        status.textContent = error.message || 'Could not save settings.';
      } finally {
        buttons.forEach(button => button.disabled = false);
      }
    }
    document.getElementById('settingsApply').addEventListener('click', () => saveSettings(false));
    document.getElementById('settingsSave').addEventListener('click', () => saveSettings(true));
    document.getElementById('settingsCancel').addEventListener('click', () => window.close());
    document.getElementById('resetColors').addEventListener('click', () => {
      const defaults = ['#5b7fa6', '#5b7fa6', '#f8f9fa', '#0d6efd', '#ffffff'];
      colorPairs.forEach((pair, index) => {
        pair.picker.value = defaults[index];
        pair.hex.value = defaults[index];
        pair.hex.setCustomValidity('');
      });
    });
    initializeSettings();
  </script>
</body>
</html>
