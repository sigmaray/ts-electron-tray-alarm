<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <style>
    body { cursor: pointer; user-select: none; overflow-x: hidden; overflow-y: auto; }
    body.alarm-dialog--preview { overflow-y: auto; }
    .alarm-dialog__actions { cursor: default; }
    #alarmMessage { overflow-wrap: anywhere; }
  </style>
</head>
<body class="bg-danger-subtle">
  <main class="container py-3 text-center">
    <h1 class="h3 text-danger">⏰ Alarm</h1>
    <p id="alarmMessage" class="fs-5"></p>
    <p id="previewLabel" class="text-body-secondary" hidden>Alarm preview</p>
    <div class="alarm-dialog__actions d-flex justify-content-center align-items-center gap-2 mt-4">
      <div class="input-group w-auto">
        <select id="postponeSelect" class="form-select" aria-label="Postpone duration">
          <option value="5">in 5 seconds</option><option value="10">in 10 seconds</option><option value="30">in 30 seconds</option>
          <option value="60">in 1 minute</option><option value="120">in 2 minutes</option><option value="300" selected>in 5 minutes</option>
          <option value="600">in 10 minutes</option><option value="900">in 15 minutes</option><option value="1800">in 30 minutes</option>
        </select>
        <button id="postponeButton" class="btn btn-warning">Postpone</button>
      </div>
      <button id="dismissButton" class="btn btn-danger">Dismiss</button>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const alarmId = params.get('alarmId') || '';
    const isPreview = params.get('preview') === 'true';
    if (isPreview) {
      document.body.classList.add('alarm-dialog--preview');
      document.title = 'Alarm preview';
      document.querySelector('h1').textContent = '⏰ Alarm preview';
      document.getElementById('previewLabel').hidden = false;
    }
    document.getElementById('alarmMessage').textContent = params.get('message') || 'Time to wake up.';
    document.getElementById('postponeSelect').value = params.get('postpone') || '300';
    document.getElementById('postponeButton').addEventListener('click', async event => {
      event.stopPropagation();
      if (isPreview) {
        window.electronAPI.closeAlarmPreview();
        return;
      }
      const result = await window.electronAPI.postponeAlarm(alarmId, Number(document.getElementById('postponeSelect').value));
      if (!result.ok) document.getElementById('alarmMessage').textContent = result.error || 'Could not postpone the alarm.';
    });
    document.getElementById('dismissButton').addEventListener('click', event => {
      event.stopPropagation();
      if (isPreview) {
        window.electronAPI.closeAlarmPreview();
        return;
      }
      window.electronAPI.dismissAlarm();
    });
  </script>
</body>
</html>
