<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Until Alarm</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .countdown-widget {
      background-color: #5B7FA6FF !important;
      user-select: none;
      -webkit-app-region: drag;
    }
    .countdown-widget__menu {
      -webkit-app-region: no-drag;
      width: 1.35rem;
      height: 1.35rem;
      padding: .1rem;
    }
    .countdown-widget__menu[hidden] {
      display: none !important;
    }
    .countdown-widget__menu.btn,
    .countdown-widget__menu.btn:hover,
    .countdown-widget__menu.btn:focus {
      color: #fff;
      background-color: #5B7FA6FF;
      border: 1px solid #fff;
      box-shadow: none;
    }
    .countdown-widget__menu-line {
      display: block;
      width: .65rem;
      height: 1px;
      border-radius: 2px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="countdown-widget card text-bg-primary shadow-sm border-0 d-flex flex-row align-items-center gap-3 px-3 py-2 fs-5 fw-bold">
    <span id="countdown-display" class="countdown-widget__display font-monospace">—</span>
    <button type="button" id="countdown-menu" class="countdown-widget__menu btn btn-light d-flex flex-column justify-content-center align-items-center gap-1" title="Countdown menu" aria-label="Open countdown menu">
      <span class="countdown-widget__menu-line"></span><span class="countdown-widget__menu-line"></span><span class="countdown-widget__menu-line"></span>
    </button>
  </div>
  <script>
    (function() {
      const el = document.getElementById('countdown-display');
      if (window.electronAPI && typeof window.electronAPI.onCountdownUpdate === 'function') {
        window.electronAPI.onCountdownUpdate(function(text) {
          if (el) el.textContent = text;
        });
      } else if (el) {
        el.textContent = '—';
      }
      const menuButton = document.getElementById('countdown-menu');
      if (menuButton && window.electronAPI && typeof window.electronAPI.onCountdownMenuButtonVisibility === 'function') {
        window.electronAPI.onCountdownMenuButtonVisibility(function(visible) {
          menuButton.hidden = !visible;
          menuButton.style.setProperty('display', visible ? 'flex' : 'none', 'important');
        });
      }
      var menuBtn = document.getElementById('countdown-menu');
      if (menuBtn && window.electronAPI && typeof window.electronAPI.showCountdownWindowMenu === 'function') {
        menuBtn.addEventListener('click', function() { window.electronAPI.showCountdownWindowMenu(); });
      }
    })();
  </script>
</body>
</html>
