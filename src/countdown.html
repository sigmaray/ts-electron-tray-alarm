<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Until Alarm</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .countdown-widget {
      background-color: var(--countdown-background-color, #5b7fa6) !important;
      font-size: var(--countdown-font-size, 15pt);
      width: max-content;
      flex: 0 0 auto;
      padding: .35em .5em;
      gap: .75em;
      user-select: none;
      -webkit-app-region: drag;
    }
    .countdown-widget__display {
      line-height: 1.2;
      align-self: center;
    }
    .countdown-widget__menu {
      -webkit-app-region: no-drag;
      width: 1.2em;
      height: 1.2em;
      padding: .08em;
      gap: .12em !important;
      font-size: inherit !important;
      line-height: 1.2;
      flex: 0 0 1.2em;
      align-self: center;
    }
    .countdown-widget__menu[hidden] {
      display: none !important;
    }
    .countdown-widget__menu.btn,
    .countdown-widget__menu.btn:hover,
    .countdown-widget__menu.btn:focus {
      color: #fff;
      background-color: var(--countdown-background-color, #5b7fa6);
      border: 1px solid #fff;
      box-shadow: none;
    }
    .countdown-widget__menu-line {
      display: block;
      width: .55em;
      height: max(1px, .06em);
      border-radius: 2px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="countdown-widget card text-bg-primary shadow-sm border-0 d-flex flex-row align-items-center fw-bold">
    <span id="countdown-display" class="countdown-widget__display font-monospace">—</span>
    <button type="button" id="countdown-menu" class="countdown-widget__menu btn btn-light d-flex flex-column justify-content-center align-items-center gap-1" title="Countdown menu" aria-label="Open countdown menu">
      <span class="countdown-widget__menu-line"></span><span class="countdown-widget__menu-line"></span><span class="countdown-widget__menu-line"></span>
    </button>
  </div>
  <script>
    (function() {
      const widget = document.querySelector('.countdown-widget');
      if (widget && window.electronAPI && typeof window.electronAPI.resizeCountdownWindow === 'function') {
        const resizeWindowToWidget = function() {
          const bounds = widget.getBoundingClientRect();
          window.electronAPI.resizeCountdownWindow(Math.ceil(bounds.width), Math.ceil(bounds.height));
        };
        new ResizeObserver(resizeWindowToWidget).observe(widget);
        requestAnimationFrame(resizeWindowToWidget);
      }

      const el = document.getElementById('countdown-display');
      if (window.electronAPI && typeof window.electronAPI.onCountdownUpdate === 'function') {
        window.electronAPI.onCountdownUpdate(function(text) {
          if (el) el.textContent = text;
        });
      } else if (el) {
        el.textContent = '—';
      }
      const menuButton = document.getElementById('countdown-menu');
      if (menuButton && window.electronAPI && typeof window.electronAPI.onCountdownMenuButtonVisibility === 'function') {
        window.electronAPI.onCountdownMenuButtonVisibility(function(visible) {
          menuButton.hidden = !visible;
          menuButton.style.setProperty('display', visible ? 'flex' : 'none', 'important');
        });
      }
      if (widget && window.electronAPI && typeof window.electronAPI.onCountdownFontSize === 'function') {
        window.electronAPI.onCountdownFontSize(function(size) {
          const points = Number.isInteger(size) && size >= 8 && size <= 32 ? size : 15;
          widget.style.setProperty('--countdown-font-size', points + 'pt');
        });
      }
      if (widget && window.electronAPI && typeof window.electronAPI.onCountdownBackgroundColor === 'function') {
        window.electronAPI.onCountdownBackgroundColor(function(color) {
          if (/^#[0-9a-f]{6}$/i.test(color)) widget.style.setProperty('--countdown-background-color', color);
        });
      }
      var menuBtn = document.getElementById('countdown-menu');
      if (menuBtn && window.electronAPI && typeof window.electronAPI.showCountdownWindowMenu === 'function') {
        menuBtn.addEventListener('click', function() { window.electronAPI.showCountdownWindowMenu(); });
      }
    })();
  </script>
</body>
</html>
