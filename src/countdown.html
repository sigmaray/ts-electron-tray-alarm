<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Until Alarm</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .countdown-widget {
      background-color: #5B7FA6FF !important;
      user-select: none;
      -webkit-app-region: drag;
    }
    .countdown-widget__close {
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body>
  <div class="countdown-widget card text-bg-primary shadow-sm border-0 d-flex flex-row align-items-center gap-3 px-3 py-2 fs-5 fw-bold">
    <span id="countdown-display" class="countdown-widget__display font-monospace">—</span>
    <button type="button" id="countdown-close" class="countdown-widget__close btn-close btn-close-white" title="Close" aria-label="Close"></button>
  </div>
  <script>
    (function() {
      const el = document.getElementById('countdown-display');
      if (window.electronAPI && typeof window.electronAPI.onCountdownUpdate === 'function') {
        window.electronAPI.onCountdownUpdate(function(text) {
          if (el) el.textContent = text;
        });
      } else if (el) {
        el.textContent = '—';
      }
      var closeBtn = document.getElementById('countdown-close');
      if (closeBtn && window.electronAPI && typeof window.electronAPI.closeCountdownWindow === 'function') {
        closeBtn.addEventListener('click', function() { window.electronAPI.closeCountdownWindow(); });
      }
    })();
  </script>
</body>
</html>
